SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

# Audit Logging - RelevantOnly für Attack Detection
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec_audit.log
SecAuditLogFormat JSON

# Debug Level
SecDebugLogLevel 0

# Collection timeout
SecCollectionTimeout 600

# Response Body Access for error detection
SecResponseBodyAccess Off
SecResponseBodyMimeType text/plain text/html text/xml

# =============================================================================
# OWASP-BASED SECURITY RULES
# Based on OWASP ModSecurity Core Rule Set (CRS) v3.x
# =============================================================================

# --- 1. SQL INJECTION DETECTION (OWASP CRS 942xxx) ---
# Detects various SQL injection patterns including:
# - Union-based SQLi
# - Boolean-based blind SQLi
# - Time-based blind SQLi
# - Stacked queries
# - SQL comments
# - SQL operators

SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_BODY|REQUEST_HEADERS|REQUEST_URI \
    "(?i:(?:union.*select|select.*from|' or |' and |1=1|1'='1|drop table|--|admin'|sleep\(|benchmark\())" \
    "id:942100,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'OWASP_CRS: SQL Injection Attack Detected',\
    tag:'attack-sqli',\
    tag:'OWASP_CRS',\
    t:urlDecodeUni,\
    t:lowercase"

# SQL Injection - Tautologies (1=1, 'a'='a')
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_BODY \
    "(?i:(?:\\d+\\s*=\\s*\\d+)|(?:'[^']*'\\s*=\\s*'[^']*'))" \
    "id:942110,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'OWASP_CRS: SQL Injection - Tautology Detected',\
    tag:'attack-sqli',\
    tag:'OWASP_CRS',\
    t:urlDecodeUni,\
    t:lowercase"

# --- 2. CROSS-SITE SCRIPTING (XSS) DETECTION (OWASP CRS 941xxx) ---
# Detects various XSS patterns including:
# - Script tags
# - Event handlers
# - JavaScript protocol
# - Data URIs
# - SVG/XML attacks

SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_BODY|REQUEST_HEADERS|REQUEST_URI \
    "(?i:script|javascript:|onerror|onload|onclick|iframe|eval)" \
    "id:941100,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'OWASP_CRS: XSS Attack Detected',\
    tag:'attack-xss',\
    tag:'OWASP_CRS',\
    t:urlDecodeUni,\
    t:htmlEntityDecode,\
    t:lowercase"

# XSS - HTML Injection
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_BODY \
    "(?i:<(?:applet|base|embed|form|iframe|link|meta|object|style))" \
    "id:941110,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'OWASP_CRS: XSS - HTML Injection Detected',\
    tag:'attack-xss',\
    tag:'OWASP_CRS',\
    t:urlDecodeUni,\
    t:htmlEntityDecode,\
    t:lowercase"

# --- 3. PATH TRAVERSAL DETECTION (OWASP CRS 930xxx) ---
# Detects various path traversal patterns including:
# - Directory traversal (../)
# - Encoded traversal (%2e%2e/)
# - Windows paths (..\\)
# - Absolute paths (/etc/passwd)
# - Null byte injection

SecRule REQUEST_URI|ARGS|ARGS_NAMES|REQUEST_BODY|REQUEST_HEADERS \
    "(?i:\\.\\./|%2e%2e|/etc/|/proc/|/windows/|c:\\\\|/var/log/|\\.htaccess|web\\.config)" \
    "id:930100,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'OWASP_CRS: Path Traversal Attack Detected',\
    tag:'attack-path-traversal',\
    tag:'OWASP_CRS',\
    t:urlDecodeUni,\
    t:lowercase"

# Path Traversal - Null Byte Injection
SecRule REQUEST_URI|ARGS|ARGS_NAMES|REQUEST_BODY \
    "(?i:%00|\\x00)" \
    "id:930110,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'OWASP_CRS: Path Traversal - Null Byte Injection',\
    tag:'attack-path-traversal',\
    tag:'OWASP_CRS',\
    t:urlDecodeUni"

# --- 4. COMMAND INJECTION DETECTION (OWASP CRS 932xxx) ---
# Detects OS command injection attempts

SecRule ARGS|ARGS_NAMES|REQUEST_BODY|REQUEST_HEADERS \
    "(?i:;\\s*(?:ls|cat|wget|curl|nc|bash|sh|cmd|whoami)|\\|\\s*(?:ls|cat|nc|bash|sh)|`(?:ls|cat|whoami)`|\\$\\(|/bin/bash|cmd\\.exe|powershell)" \
    "id:932100,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'OWASP_CRS: OS Command Injection Detected',\
    tag:'attack-command-injection',\
    tag:'OWASP_CRS',\
    t:urlDecodeUni,\
    t:lowercase"
